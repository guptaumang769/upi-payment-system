server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # NATIVE backend: serve config files bundled on the classpath rather than from a Git repo.
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

management:
  endpoints:
    web:
      exposure:
        include: health,info
