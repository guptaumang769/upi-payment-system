# Shared defaults served to every config client (matched by the "application" name fallback).
# Per-service files (payment-service.yml, wallet-service.yml) override/augment these.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
