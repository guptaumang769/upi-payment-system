server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  client:
    # This IS the registry — it must not try to register with or fetch from a peer.
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info
