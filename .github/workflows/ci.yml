name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Tests
          path: '**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [payment-service, wallet-service, api-gateway, config-server, discovery-server]
    steps:
      - uses: actions/checkout@v4
      - name: Docker build ${{ matrix.service }}
        run: docker build -f ${{ matrix.service }}/Dockerfile -t upi-${{ matrix.service }}:ci .
